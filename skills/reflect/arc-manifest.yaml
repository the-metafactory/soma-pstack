      - "./**"
  network:
    - host: api.anthropic.com
      reason: Send the scoped session evidence to an authorized Claude reviewer.
    - host: api.openai.com
      reason: Send the scoped session evidence to an authorized OpenAI reviewer.
    - host: api.github.com
      reason: Read cited context or file backlog items only when externally authorized.
  bash:
    allowed: true
  secrets: []
