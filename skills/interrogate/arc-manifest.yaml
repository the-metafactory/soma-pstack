schema: arc/v1
name: interrogate
version: 0.1.0
type: skill
tier: custom
description: Send adversaries from different model families to break a change or design, and report only the findings a rerun proves.
license: MIT
author:
  name: The MetaFactory
  github: the-metafactory
upstream:
  repo: cursor/plugins
  path: pstack/skills/interrogate/SKILL.md
  commit: c742dd61706fbacc1b95f1a20b7b988cf096ce6c
capabilities:
  filesystem:
    read:
      - "./**"
      - "/tmp/interrogate-*/**"
    write:
      # Report-only: the skill writes only in its mktemp run directory under
      # /tmp. Each adversary gets a clone there with its own copy of the
      # scope's node_modules, so no seat shares a writable path with the scope.
      # The codex seat's profile denies the scope; a sub-agent seat has no
      # sandbox and is held to its clone by the brief alone. On macOS, /tmp is
      # a link to /private/tmp, so tools report these paths as /private/tmp.
      - "/tmp/interrogate-*/**"
  network:
    - host: api.anthropic.com
      reason: Run a Claude adversary through an authenticated CLI.
    - host: api.openai.com
      reason: Run the codex adversary through an authenticated CLI.
  bash:
    # git clone and apply for each adversary, model CLIs, and sandboxed reruns of each finding.
    allowed: true
  secrets: []
