schema: arc/v1
name: benchmark-checklist
version: 0.1.0
type: skill
tier: custom
description: Vet performance claims against measured evidence and benchmark limits.
license: MIT
author:
  name: The MetaFactory
  github: the-metafactory
upstream:
  repo: cursor/plugins
  path: pstack/skills/benchmark-checklist/SKILL.md
  commit: c742dd61706fbacc1b95f1a20b7b988cf096ce6c
capabilities:
  filesystem:
    read:
      - "./**"
    # Measurement scripts may write datasets, profile output and benchmark results.
    write:
      - "./**"
      - "/tmp/**"
  network:
    - host: localhost
      reason: Measure local server or load-generator endpoints when the benchmark uses them.
    - host: 127.0.0.1
      reason: Measure local benchmark endpoints bound to an IPv4 address.
  bash:
    # Unrestricted shell access runs caller-selected measurement scripts and
    # profilers. Review their remote targets, native temporary directory and
    # external dataset/output paths before running; these vary by benchmark.
    allowed: true
  secrets: []
