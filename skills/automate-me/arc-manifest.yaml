schema: arc/v1
name: automate-me
version: 0.1.0
type: skill
tier: custom
description: Mine this workspace's history and propose approval-gated edits to the principal's Soma home that capture how they work.
license: MIT
author:
  name: The MetaFactory
  github: the-metafactory
upstream:
  repo: cursor/plugins
  path: pstack/skills/automate-me/SKILL.md
  commit: c742dd61706fbacc1b95f1a20b7b988cf096ce6c
capabilities:
  filesystem:
    read:
      - "./**"
      - "~/.claude/projects/**"
      - "~/.codex/sessions/**"
      - "~/.pi/agent/sessions/**"
      - "~/.cursor/projects/*/agent-transcripts/**"
      - "~/.soma/**"
    # Undeclared writes, each made only for a row the principal approved:
    # profile/communication.md in the Soma home, the memory store through
    # `soma memory write` (and an Algorithm run's proposal under memory/WORK/),
    # and `soma install <substrate> --apply`, which rewrites the Claude Code,
    # Codex and pi projections. Soma's runtime private-content policy
    # (src/policy/policy.ts in the soma repo) treats the Soma home's memory/,
    # profile/ and imports/ as private, and this repo is public, so those paths
    # stay out of the list rather than hiding behind a broader glob.
    # The paths below hard-code ~/.soma; the skill honors SOMA_HOME.
    write:
      - "./**"
      - "~/.soma/policy/behavior.md"
      - "~/.soma/skills/the-algorithm/references/principles.local.md"
      - "~/.soma/skills/the-algorithm/references/principles-local/**"
  network: []
  bash:
    allowed: true
  secrets: []
