schema: arc/v1
name: show-me-your-work
version: 0.1.0
type: skill
tier: custom
description: Keep an append-only decision trail for unattended work with transcript audit and cross-model review.
license: MIT
author:
  name: The MetaFactory
  github: the-metafactory
upstream:
  repo: cursor/plugins
  path: pstack/skills/show-me-your-work/
  commit: b6375f1c3a8600fa8907d2214ed9f8aad0028dde
capabilities:
  filesystem:
    read:
      - "./**"
      - "~/.claude/projects/**"
      - "~/.codex/sessions/**"
      - "~/.cursor/projects/*/agent-transcripts/**"
      - "~/.pi/agent/sessions/**"
    write:
      - "./**"
  network:
    - host: api.anthropic.com
      reason: Send this run's redacted trail and transcript to an authorized Claude reviewer.
    - host: api.openai.com
      reason: Send this run's redacted trail and transcript to an authorized OpenAI reviewer.
  bash:
    # The logger, transcript extraction and reviewer CLI use shell access.
    allowed: true
  secrets: []
