# Install: arc install https://github.com/the-metafactory/soma-pstack
schema: arc/v1
name: soma-pstack
version: 0.1.0
type: library
tier: custom
description: pstack skills ported to run on top of Soma.
license: MIT
author:
  name: The MetaFactory
  github: the-metafactory
artifacts:
  - path: skills/benchmark-checklist
    description: Vet performance claims against measured evidence and benchmark limits.
  - path: skills/recall
    description: Rebuild recent working context from Soma records and live repository state.
  - path: skills/correct
    description: Find repeated engineering mistakes and enforce corrections structurally.
  - path: skills/create-verification-skill
    description: Generate a project verification skill with a feature map and captured evidence.
  - path: skills/no-comments
    description: Remove redundant comments and encode constraints while lowering the lint baseline.
  - path: skills/bug-fix-test
    description: "Gate a bug-fix-test regression check on a cheap path and capture failing-before evidence. Requests naming tdd, TDD, red-green-refactor or general test-first development belong to Soma's tdd skill."
  - path: skills/show-me-your-work
    description: Keep an append-only decision trail with transcript audit and cross-model review.
  - path: skills/blast-radius
    description: Find breakage beyond a change's diff and grade the evidence for each fact its safety depends on.
  - path: skills/ketchup
    description: Catch the principal up since their last message and list each pending call with pick, evidence and risk.
  - path: skills/reflect
    description: Review a finished session through judgment, tooling and divergent lenses, then synthesize skill proposals and structural backlog items.
  - path: skills/typescript-best-practices
    description: Apply TypeScript type-system rules, from narrowing order to total types, when reading or editing .ts and .tsx files.
  - path: skills/why
    description: Reconstruct the motivation behind code from a fixed Soma evidence roster and return a cited read that separates found from inferred.
  - path: skills/how
    description: Explain how a subsystem works from a cited trace of the code, with read-only explorers and one explainer.
  - path: skills/technical-writing
    description: Write and review docs, readmes and PR text by Diátaxis mode and sentence rules, with humanizer as the prose pass.
  - path: skills/sharpen
    description: Make a task deeper, not bigger. Name what a top professional would add, the rawest source material, their methods and an outside check, then rewrite the prompt with the principal's choices left open.
  - path: skills/statechart
    description: Check a TLA+ model with TLC, draw it as a Mermaid statechart, and report the shortest path to each state that breaks a rule.
  - path: skills/create-formal-verification-skill
    description: Generate a project-local skill that formally verifies the code where a bug costs most and tests reach least.
  - path: skills/maintain-formal-verification-skill
    description: Bring a project's formal verification back in line with the code after changes that skipped it.
  - path: skills/explain
    description: Explain a body of work plainly by running how and why and weaving what they find into one account.
  - path: skills/playbooks
    description: Playbook cards, the step lists Soma's working method routes each task shape to.
  - path: skills/worktree-audit
    description: Read-only audit of a repo's git worktrees with a suggested cleanup bucket each.
  - path: skills/ketchup-video
    description: Catch the principal up like ketchup, with a short subtitled slide video of what happened and the waiting calls as text under it.
  - path: skills/maintain-verification-skill
    description: Keep a project's verify skill and feature map honest with a source wave, a live pass over every feature and at most one PR of proven corrections.
  - path: skills/automate-me
    description: Mine this workspace's history and propose approval-gated edits to the principal's Soma home that capture how they work.
