name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Pack check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      # check-pack.ts and its tests run `arc validate` from PATH. v0.46.1 is the
      # first release that accepts lowercase SKILL.md names (arc#385).
      - uses: actions/checkout@v4
        with:
          repository: the-metafactory/arc
          ref: v0.46.1
          path: .arc

      - name: Put arc on PATH
        run: |
          (cd .arc && bun install --frozen-lockfile)
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec bun "%s/.arc/src/cli.ts" "$@"\n' "$GITHUB_WORKSPACE" > "$HOME/.local/bin/arc"
          chmod +x "$HOME/.local/bin/arc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: arc --version

      # The worktree-audit member's script and its tests need ripgrep.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      # Scoped to test/: a bare `bun test` would also run arc's suite in .arc/.
      - run: bun test test/

      # CHECK_PACK_UPSTREAM checks that each upstream pin resolves at its commit
      # and is the kind its trailing `/` says; offline, a directory pinned
      # without its `/` passes as a file. The cursor org's IP allow list
      # refuses the GitHub API from runners (HTTP 403), so CI reads the pins
      # from an anonymous partial clone of the public repo instead of `gh api`.
      - name: Clone the upstream repository
        working-directory: ${{ runner.temp }}
        run: |
          unset GH_TOKEN GITHUB_TOKEN
          clone="$RUNNER_TEMP/cursor-plugins"
          git -c credential.helper= clone -q --filter=blob:none --no-checkout https://github.com/cursor/plugins "$clone"
          echo "CHECK_PACK_UPSTREAM_REPO=$clone" >> "$GITHUB_ENV"

      - run: bun scripts/check-pack.ts
        env:
          CHECK_PACK_UPSTREAM: "1"
